version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: globetrotter-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Deep@1511
      POSTGRES_DB: globetrotter_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: globetrotter-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: 'postgresql://postgres:Deep%401511@postgres:5432/globetrotter_db?schema=public'
      JWT_SECRET: 'globetrotter_production_secret_key_2026'
      FRONTEND_URL: 'http://localhost:5173'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: globetrotter-frontend
    restart: always
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  pgdata:
